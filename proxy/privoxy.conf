logdir /var/log/privoxy
logfile privoxy.log
debug 1
debug 4096
debug 8192

listen-address 0.0.0.0:8118

# everything else through vpn socks (t = pass hostname to socks for remote DNS)
forward-socks5t / 127.0.0.1:1080 .

# rest of aws direct
forward .amazonaws.com .

# eks through vpn (more specific, overrides catch-all)
forward-socks5t .eks.amazonaws.com 127.0.0.1:1080 .


confdir /etc/privoxy
templdir /usr/share/privoxy/templates
keep-alive-timeout 300
connection-sharing 1
socket-timeout 300